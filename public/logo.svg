<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B6914"/>
      <stop offset="25%" stop-color="#B8943E"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="75%" stop-color="#D4B96A"/>
      <stop offset="100%" stop-color="#A88B3A"/>
    </linearGradient>
    <linearGradient id="gold-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B5010"/>
      <stop offset="50%" stop-color="#8B6914"/>
      <stop offset="100%" stop-color="#6B5010"/>
    </linearGradient>
  </defs>

  <!-- Z letter with serif -->
  <path d="M22 38 L80 38 L22 82 L85 82" stroke="url(#gold)" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>
  <!-- Z top serif -->
  <path d="M18 38 L26 38" stroke="url(#gold)" stroke-width="7" stroke-linecap="square" fill="none"/>
  <!-- Z bottom serif -->
  <path d="M78 82 L86 82" stroke="url(#gold)" stroke-width="7" stroke-linecap="square" fill="none"/>

  <!-- Q circle -->
  <circle cx="110" cy="60" r="36" stroke="url(#gold)" stroke-width="6.5" fill="none"/>

  <!-- Q tail - curved sweeping from bottom-right -->
  <path d="M132 84 C138 92, 148 100, 158 108" stroke="url(#gold)" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Crown on the Q tail -->
  <path d="M148 96 L153 88 L158 96 L163 88 L168 96" stroke="url(#gold)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
