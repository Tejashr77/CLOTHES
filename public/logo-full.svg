<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" fill="none">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B6914"/>
      <stop offset="25%" stop-color="#B8943E"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="75%" stop-color="#D4B96A"/>
      <stop offset="100%" stop-color="#A88B3A"/>
    </linearGradient>
    <linearGradient id="gold-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A88B3A"/>
      <stop offset="30%" stop-color="#C9A84C"/>
      <stop offset="70%" stop-color="#D4B96A"/>
      <stop offset="100%" stop-color="#A88B3A"/>
    </linearGradient>
  </defs>

  <!-- Z letter with serif -->
  <path d="M108 38 L166 38 L108 82 L171 82" stroke="url(#gold)" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>
  <path d="M104 38 L112 38" stroke="url(#gold)" stroke-width="7" stroke-linecap="square" fill="none"/>
  <path d="M164 82 L172 82" stroke="url(#gold)" stroke-width="7" stroke-linecap="square" fill="none"/>

  <!-- Q circle -->
  <circle cx="196" cy="60" r="36" stroke="url(#gold)" stroke-width="6.5" fill="none"/>

  <!-- Q tail -->
  <path d="M218 84 C224 92, 234 100, 244 108" stroke="url(#gold)" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Crown -->
  <path d="M234 96 L239 88 L244 96 L249 88 L254 96" stroke="url(#gold)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- ZAQUEEN text -->
  <text x="200" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="400" letter-spacing="10" fill="url(#gold-text)">ZAQUEEN</text>

  <!-- Tagline -->
  <text x="200" y="178" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="2" fill="#8B7355" opacity="0.85">your design, our couture, designed to reign</text>
</svg>
