<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" fill="none">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8943E"/>
      <stop offset="30%" stop-color="#C9A84C"/>
      <stop offset="60%" stop-color="#D4B96A"/>
      <stop offset="100%" stop-color="#A88B3A"/>
    </linearGradient>
  </defs>

  <!-- Z letter -->
  <path d="M72 30 L132 30 L72 80 L137 80" stroke="url(#gold)" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>

  <!-- Q circle -->
  <circle cx="162" cy="55" r="34" stroke="url(#gold)" stroke-width="6" fill="none"/>

  <!-- Q tail -->
  <path d="M185 78 L212 115" stroke="url(#gold)" stroke-width="6" stroke-linecap="square"/>

  <!-- Crown -->
  <path d="M197 100 L203 90 L209 100 L215 90 L221 100" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- ZAQUEEN text -->
  <text x="150" y="155" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="400" letter-spacing="8" fill="url(#gold)" text-anchor="middle">ZAQUEEN</text>

  <!-- Tagline -->
  <text x="150" y="180" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2" fill="#8B7355" opacity="0.8" text-anchor="middle">your design, our couture, designed to reign</text>
</svg>
